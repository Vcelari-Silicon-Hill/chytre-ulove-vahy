name: Firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.1
          arduino-cli lib install "SparkFun Qwiic Scale NAU7802 Arduino Library" "OneWire" "DallasTemperature"
      - name: Build
        run: ./firmware/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ulova_vaha-firmware
          path: server/static/flash/firmware/
